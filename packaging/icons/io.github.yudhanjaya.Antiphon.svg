<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Antiphon: a glossy RealPlayer-style play button between two answering sound arcs. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#0f4f9e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a6372"/>
      <stop offset="1" stop-color="#1b1e23"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#plate)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#0b0d10" stroke-opacity="0.6"/>
  <g fill="none" stroke="#8fd8ff" stroke-width="5" stroke-linecap="round">
    <path d="M26 44 a28 28 0 0 0 0 40" opacity="0.55"/>
    <path d="M17 36 a40 40 0 0 0 0 56" opacity="0.3"/>
    <path d="M102 44 a28 28 0 0 1 0 40" opacity="0.55"/>
    <path d="M111 36 a40 40 0 0 1 0 56" opacity="0.3"/>
  </g>
  <circle cx="64" cy="64" r="31" fill="#4aa8ff" opacity="0.35"/>
  <circle cx="64" cy="64" r="27" fill="url(#body)" stroke="#0c0e11" stroke-width="1.5"/>
  <ellipse cx="64" cy="50" rx="19" ry="12" fill="url(#gloss)"/>
  <path d="M56 50 L78 64 L56 78 Z" fill="#ffffff"/>
</svg>
