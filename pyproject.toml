[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "antiphon"
version = "0.1.0"
description = "A RealPlayer-style Linux media player with a YouTube playlist downloader and parametric EQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.6",
  "PyGObject>=3.46",
  "mutagen>=1.47",
  "watchdog>=4.0",
  "yt-dlp[default]",  # [default] brings yt-dlp-ejs, needed for YouTube
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
antiphon = "antiphon.__main__:main"

[tool.setuptools.packages.find]
include = ["antiphon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
