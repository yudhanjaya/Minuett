[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minuett"
version = "0.2.0"
description = "A RealPlayer-style Linux media player with a YouTube playlist downloader and parametric EQ"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials>=6.6",  # QtCore/Gui/Widgets only; keeps bundles small
  "PyGObject>=3.46",
  "mutagen>=1.47",
  "yt-dlp[default]",  # [default] brings yt-dlp-ejs, needed for YouTube
  "secretstorage>=3.3",  # lets yt-dlp decrypt Chromium-family browser cookies (YouTube sign-in)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minuett = "minuett.__main__:main"

[tool.setuptools.packages.find]
include = ["minuett*"]

[tool.setuptools.package-data]
"minuett.ui.skin" = ["base.qss", "themes/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
